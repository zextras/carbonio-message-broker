cluster_formation.peer_discovery_backend = rabbit_peer_discovery_consul

cluster_formation.consul.host = 127.0.0.1
cluster_formation.consul.svc = carbonio-message-broker-clustered
cluster_formation.consul.svc_port = 10000
cluster_formation.consul.svc_addr_auto = true
cluster_formation.consul.svc_addr_use_nodename = true
cluster_formation.consul.lock_prefix = carbonio-message-broker-clustered
cluster_formation.discovery_retry_limit = unlimited

default_queue_type = quorum
